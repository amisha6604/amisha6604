<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t"><title id="t">waste-Water project card</title><desc>Illustration of a laboratory beaker with a droplet and labels for BOD, COD, DO, TSS/TDS, pH and trickling filter. Stack: HTML, CSS, JavaScript.</desc><style>
.tw{animation:tw 3.4s ease-in-out infinite}
