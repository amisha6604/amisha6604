<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t"><title id="t">MahaPath project card</title><desc>Illustration of a map where two rivers meet at the Sangam, with pins for events, ghats, medical and parking, and a nearest-facility line. Stack: Node.js, Express 5, MongoDB, Mongoose, EJS, Leaflet.js, Bootstrap 5.</desc><style>
.tw{animation:tw 3.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.fl{animation:fl 7s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.tw,.fl{animation:none}}
