<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="778" viewBox="0 0 1200 778" role="img" aria-labelledby="t"><title id="t">Engineering journey timeline</title><desc>Engineering journey timeline: 2022: Joined IIT (BHU), Varanasi. Started Biochemical Engineering. The pull toward software came soon after.; NOV 2024: A first public project. A wastewater calculator in plain HTML, CSS and JS: engineering formulas turned into a tool.; AUG 2026: Two builds begin. MahaPath, a full-stack Node.js platform, and Voyara, a C++ routing engine.; SEP 2026: From pages to a platform. MahaPath gains roles, an admin dashboard, maps, facilities, validation, rate limiting and CSRF protection.; SEP - OCT 2026: Routing gets serious. Voyara goes from plain Dijkstra to time-dependent, constrained routing with alternatives, checked by brute-force oracle tests.; NOW: Going deeper on fundamentals. System design, backend architecture and DSA, with A* and multi-city planning next on Voyara's roadmap.</desc><style>
.tw{animation:tw 3.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.fl{animation:fl 7s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.tw,.fl{animation:none}}
</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBF7F0"/><stop offset=".55" stop-color="#F6F0FC"/><stop offset="1" stop-color="#E6DCF5"/></linearGradient></defs><rect width="1200" height="778" rx="28" fill="url(#bg)"/><rect x="12" y="12" width="1176" height="754" rx="18" fill="none" stroke="#8E7CC3" stroke-opacity=".28" stroke-dasharray="2 6"/><line x1="250" y1="70" x2="250" y2="728" stroke="#8E7CC3" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/><text x="214" y="99" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" letter-spacing="1.5" fill="#6B5B95">2022</text><circle cx="250" cy="94" r="27" fill="#E6DCF5" stroke="#8E7CC3" stroke-width="2.5"/><g transform="translate(250 94)"><path d="M-13,-3 L0,-10 L13,-3 L0,4Z M-8,2 v7 q8,5 16,0 v-7" fill="#2E1A3C" stroke="#2E1A3C" stroke-linejoin="round"/></g><text x="306" y="90" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="27" fill="#2E1A3C">Joined IIT (BHU), Varanasi</text><text x="306" y="120" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16.5" fill="#2E1A3C" opacity=".85">Started Biochemical Engineering. The pull toward software came soon after.</text><text x="214" y="217" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" letter-spacing="1.5" fill="#6B5B95">NOV 2024</text><circle cx="250" cy="212" r="27" fill="#E6DCF5" stroke="#8E7CC3" stroke-width="2.5"/><g transform="translate(250 212)"><path d="M0,-12 c7,9 11,13 11,19 a11,11 0 1,1 -22,0 c0,-6 4,-10 11,-19z" fill="#8E7CC3" stroke="#2E1A3C" stroke-width="1.5"/></g><text x="306" y="208" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="27" fill="#2E1A3C">A first public project</text><text x="306" y="238" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16.5" fill="#2E1A3C" opacity=".85">A wastewater calculator in plain HTML, CSS and JS: engineering formulas</text><text x="306" y="261" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16.5" fill="#2E1A3C" opacity=".85">turned into a tool.</text><text x="214" y="335" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" letter-spacing="1.5" fill="#6B5B95">AUG 2026</text><circle cx="250" cy="330" r="27" fill="#E6DCF5" stroke="#8E7CC3" stroke-width="2.5"/><g transform="translate(250 330)"><path d="M0,13 c-9,-11 -11,-14 -11,-19 a11,11 0 1,1 22,0 c0,5 -2,8 -11,19z" fill="#E39BBB" stroke="#2E1A3C" stroke-width="1.5"/><circle cy="-6" r="4" fill="#fff"/></g><text x="306" y="326" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="27" fill="#2E1A3C">Two builds begin</text><text x="306" y="356" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16.5" fill="#2E1A3C" opacity=".85">MahaPath, a full-stack Node.js platform, and Voyara, a C++ routing engine.</text><text x="214" y="453" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" letter-spacing="1.5" fill="#6B5B95">SEP 2026</text><circle cx="250" cy="448" r="27" fill="#E6DCF5" stroke="#8E7CC3" stroke-width="2.5"/><g transform="translate(250 448)"><path d="M-6,-8 l-9,8 l9,8 M6,-8 l9,8 l-9,8" fill="none" stroke="#2E1A3C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="306" y="444" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="27" fill="#2E1A3C">From pages to a platform</text><text x="306" y="474" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16.5" fill="#2E1A3C" opacity=".85">MahaPath gains roles, an admin dashboard, maps, facilities, validation, rate</text><text x="306" y="497" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16.5" fill="#2E1A3C" opacity=".85">limiting and CSRF protection.</text><text x="214" y="571" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" letter-spacing="1.5" fill="#6B5B95">SEP - OCT 2026</text><circle cx="250" cy="566" r="27" fill="#E6DCF5" stroke="#8E7CC3" stroke-width="2.5"/><g transform="translate(250 566)"><path d="M-11,7 L0,-9 L11,5" fill="none" stroke="#2E1A3C" stroke-width="2"/><circle cx="-11" cy="7" r="4.5" fill="#8E7CC3" stroke="#2E1A3C"/><circle cy="-9" r="4.5" fill="#8E7CC3" stroke="#2E1A3C"/><circle cx="11" cy="5" r="4.5" fill="#8E7CC3" stroke="#2E1A3C"/></g><text x="306" y="562" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="27" fill="#2E1A3C">Routing gets serious</text><text x="306" y="592" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16.5" fill="#2E1A3C" opacity=".85">Voyara goes from plain Dijkstra to time-dependent, constrained routing with</text><text x="306" y="615" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16.5" fill="#2E1A3C" opacity=".85">alternatives, checked by brute-force oracle tests.</text><text x="214" y="689" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" letter-spacing="1.5" fill="#6B5B95">NOW</text><circle cx="250" cy="684" r="27" fill="#F4C6D8" stroke="#8E7CC3" stroke-width="2.5"/><circle cx="250" cy="684" r="27" fill="none" stroke="#E39BBB"><animate attributeName="r" values="27;40" dur="2.8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="2.8s" repeatCount="indefinite"/></circle><g transform="translate(250 684)"><path d="M0,-14 Q0,0 14,0 Q0,0 0,14 Q0,0 -14,0 Q0,0 0,-14Z" fill="#2E1A3C"/></g><text x="306" y="680" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="27" fill="#2E1A3C">Going deeper on fundamentals</text><text x="306" y="710" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16.5" fill="#2E1A3C" opacity=".85">System design, backend architecture and DSA, with A* and multi-city planning</text><text x="306" y="733" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="16.5" fill="#2E1A3C" opacity=".85">next on Voyara's roadmap.</text><path class="tw" style="animation-delay:0s" opacity="1" fill="#8E7CC3" d="M1120,78 Q1120,90 1132,90 Q1120,90 1120,102 Q1120,90 1108,90 Q1120,90 1120,78Z"/><path class="tw" style="animation-delay:1.1s" opacity="1" fill="#8E7CC3" d="M1060,699 Q1060,708 1069,708 Q1060,708 1060,717 Q1060,708 1051,708 Q1060,708 1060,699Z"/><g opacity="1" transform="rotate(0 1110 678)"><circle cx="1110.0" cy="668.1" r="8.3" fill="#F4C6D8"/><circle cx="1119.4" cy="674.9" r="8.3" fill="#F4C6D8"/><circle cx="1115.8" cy="686.0" r="8.3" fill="#F4C6D8"/><circle cx="1104.2" cy="686.0" r="8.3" fill="#F4C6D8"/><circle cx="1100.6" cy="674.9" r="8.3" fill="#F4C6D8"/><circle cx="1110" cy="678" r="4.7" fill="#fff"/></g><g opacity="1" transform="rotate(0 80 120)"><circle cx="80.0" cy="111.8" r="6.9" fill="#C9B6EC"/><circle cx="87.8" cy="117.5" r="6.9" fill="#C9B6EC"/><circle cx="84.8" cy="126.7" r="6.9" fill="#C9B6EC"/><circle cx="75.2" cy="126.7" r="6.9" fill="#C9B6EC"/><circle cx="72.2" cy="117.5" r="6.9" fill="#C9B6EC"/><circle cx="80" cy="120" r="3.9" fill="#fff"/></g></svg>