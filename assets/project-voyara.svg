<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t"><title id="t">Voyara project card</title><desc>Illustration of a flight-route graph between airports such as VNS, DEL, BOM, BLR, DXB and SIN with a highlighted best route, a dashed alternative, and constraint labels. Stack: C++17, Dijkstra, Node.js, Express, PostgreSQL.</desc><style>
.tw{animation:tw 3.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.fl{animation:fl 7s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.tw,.fl{animation:none}}
</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBF7F0"/><stop offset=".55" stop-color="#F6F0FC"/><stop offset="1" stop-color="#E6DCF5"/></linearGradient></defs><rect width="1200" height="420" rx="28" fill="url(#bg)"/><rect x="12" y="12" width="1176" height="396" rx="18" fill="none" stroke="#8E7CC3" stroke-opacity=".28" stroke-dasharray="2 6"/><text x="64" y="64" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" letter-spacing="3" fill="#6B5B95">FEATURE No. 2</text><rect x="64" y="82" width="290" height="28" rx="14.0" fill="#F4C6D8" fill-opacity="0.9" stroke="#E39BBB"/><text x="209.0" y="100.2" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12" letter-spacing="1.2" fill="#2E1A3C">ALGORITHMS &#183; BACKEND SYSTEMS</text><text x="62" y="193" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="66" fill="#2E1A3C">Voyara</text><path d="M64,209 q40,-12 80,0 t80,0 t80,0" fill="none" stroke="#E39BBB" stroke-width="3" stroke-linecap="round"/><text x="64" y="251" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="19" fill="#2E1A3C">A C++ routing engine that finds, constrains and</text><text x="64" y="279" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="19" fill="#2E1A3C">ranks flight itineraries behind a Node API.</text><rect x="64" y="308" width="62" height="30" rx="15.0" fill="#fff" fill-opacity="0.9" stroke="#C9B6EC"/><text x="95.0" y="327.6" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13" letter-spacing="0" fill="#2E1A3C">C++17</text><rect x="134" y="308" width="84" height="30" rx="15.0" fill="#fff" fill-opacity="0.9" stroke="#C9B6EC"/><text x="176.0" y="327.6" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13" letter-spacing="0" fill="#2E1A3C">Dijkstra</text><rect x="226" y="308" width="77" height="30" rx="15.0" fill="#fff" fill-opacity="0.9" stroke="#C9B6EC"/><text x="264.5" y="327.6" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13" letter-spacing="0" fill="#2E1A3C">Node.js</text><rect x="311" y="308" width="77" height="30" rx="15.0" fill="#fff" fill-opacity="0.9" stroke="#C9B6EC"/><text x="349.5" y="327.6" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13" letter-spacing="0" fill="#2E1A3C">Express</text><rect x="396" y="308" width="99" height="30" rx="15.0" fill="#fff" fill-opacity="0.9" stroke="#C9B6EC"/><text x="445.5" y="327.6" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13" letter-spacing="0" fill="#2E1A3C">PostgreSQL</text><rect x="503" y="308" width="84" height="30" rx="15.0" fill="#fff" fill-opacity="0.9" stroke="#C9B6EC"/><text x="545.0" y="327.6" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="13" letter-spacing="0" fill="#2E1A3C">Makefile</text><g transform="translate(660 36) rotate(1.2 240 174)"><rect x="9" y="9" width="480" height="348" rx="18" fill="#C9B6EC" opacity=".6"/><rect width="480" height="348" rx="18" fill="#FBF7F0" stroke="#8E7CC3" stroke-opacity=".4"/><g><line x1="62" y1="226" x2="118" y2="92" stroke="#C9B6EC" stroke-width="2"/><line x1="62" y1="226" x2="120" y2="266" stroke="#C9B6EC" stroke-width="2"/><line x1="118" y1="92" x2="120" y2="266" stroke="#C9B6EC" stroke-width="2"/><line x1="118" y1="92" x2="262" y2="104" stroke="#C9B6EC" stroke-width="2"/><line x1="118" y1="92" x2="250" y2="262" stroke="#C9B6EC" stroke-width="2"/><line x1="120" y1="266" x2="250" y2="262" stroke="#C9B6EC" stroke-width="2"/><line x1="120" y1="266" x2="262" y2="104" stroke="#C9B6EC" stroke-width="2"/><line x1="250" y1="262" x2="410" y2="208" stroke="#C9B6EC" stroke-width="2"/><line x1="262" y1="104" x2="410" y2="208" stroke="#C9B6EC" stroke-width="2"/><line x1="262" y1="104" x2="392" y2="80" stroke="#C9B6EC" stroke-width="2"/><line x1="392" y1="80" x2="410" y2="208" stroke="#C9B6EC" stroke-width="2"/><polyline points="62,226 120,266 250,262 410,208" fill="none" stroke="#E39BBB" stroke-width="3" stroke-dasharray="7 6"/><polyline points="62,226 118,92 262,104 410,208" fill="none" stroke="#8E7CC3" stroke-width="5" stroke-linejoin="round" stroke-dasharray="14 8"><animate attributeName="stroke-dashoffset" from="44" to="0" dur="3s" repeatCount="indefinite"/></polyline><circle cx="62" cy="226" r="19" fill="#FBF7F0" stroke="#2E1A3C" stroke-width="2"/><text x="62" y="230" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#2E1A3C">VNS</text><circle cx="118" cy="92" r="19" fill="#FBF7F0" stroke="#2E1A3C" stroke-width="2"/><text x="118" y="96" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#2E1A3C">DEL</text><circle cx="120" cy="266" r="19" fill="#FBF7F0" stroke="#2E1A3C" stroke-width="2"/><text x="120" y="270" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#2E1A3C">BOM</text><circle cx="250" cy="262" r="19" fill="#FBF7F0" stroke="#2E1A3C" stroke-width="2"/><text x="250" y="266" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#2E1A3C">BLR</text><circle cx="262" cy="104" r="19" fill="#FBF7F0" stroke="#2E1A3C" stroke-width="2"/><text x="262" y="108" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#2E1A3C">DXB</text><circle cx="410" cy="208" r="19" fill="#FBF7F0" stroke="#2E1A3C" stroke-width="2"/><text x="410" y="212" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#2E1A3C">SIN</text><circle cx="392" cy="80" r="19" fill="#FBF7F0" stroke="#2E1A3C" stroke-width="2"/><text x="392" y="84" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#2E1A3C">BKK</text><rect x="16" y="14" width="172" height="22" rx="11" fill="#fff" stroke="#C9B6EC"/><text x="102" y="29" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#2E1A3C">time-dependent flight graph</text><rect x="150" y="296" width="70" height="22" rx="11" fill="#fff" stroke="#C9B6EC"/><text x="185" y="311" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#2E1A3C">max stops</text><rect x="226" y="296" width="84" height="22" rx="11" fill="#fff" stroke="#C9B6EC"/><text x="268" y="311" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#2E1A3C">max layover</text><rect x="316" y="296" width="56" height="22" rx="11" fill="#fff" stroke="#C9B6EC"/><text x="344" y="311" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#2E1A3C">budget</text><line x1="300" y1="42" x2="334" y2="42" stroke="#8E7CC3" stroke-width="4"/><text x="340" y="46" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10" fill="#2E1A3C">best</text><line x1="380" y1="42" x2="414" y2="42" stroke="#E39BBB" stroke-width="3" stroke-dasharray="5 4"/><text x="420" y="46" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10" fill="#2E1A3C">alt.</text></g><text x="240" y="336" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="10" letter-spacing="1.5" fill="#6B5B95" opacity=".8">ILLUSTRATIVE GRAPH, NOT REAL DATA</text></g><rect x="690" y="22" width="86" height="24" fill="#F4C6D8" opacity=".8" transform="rotate(-6 733 34)"/><rect x="1050" y="352" width="86" height="24" fill="#C9B6EC" opacity=".85" transform="rotate(-5 1093 364)"/><path class="tw" style="animation-delay:0s" opacity="1" fill="#8E7CC3" d="M630,51 Q630,60 639,60 Q630,60 630,69 Q630,60 621,60 Q630,60 630,51Z"/><path class="tw" style="animation-delay:1s" opacity="1" fill="#8E7CC3" d="M1160,370 Q1160,380 1170,380 Q1160,380 1160,390 Q1160,380 1150,380 Q1160,380 1160,370Z"/><g opacity="1" transform="rotate(0 1158 60)"><circle cx="1158.0" cy="52.3" r="6.4" fill="#F4C6D8"/><circle cx="1165.3" cy="57.6" r="6.4" fill="#F4C6D8"/><circle cx="1162.5" cy="66.2" r="6.4" fill="#F4C6D8"/><circle cx="1153.5" cy="66.2" r="6.4" fill="#F4C6D8"/><circle cx="1150.7" cy="57.6" r="6.4" fill="#F4C6D8"/><circle cx="1158" cy="60" r="3.6" fill="#fff"/></g></svg>